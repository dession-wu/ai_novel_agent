server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 非默认端口（如 8081）公网访问时，禁止绝对重定向丢端口导致空白页
    absolute_redirect off;

    # Gzip for text assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Reverse proxy: same-origin /api -> backend container (compose service name)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        # 保留原始 Host（含端口），防止 FastAPI 307 重定向丢端口
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI generation endpoints can take a long time
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Static assets with long cache (hashed filenames)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}