services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: novel_agent_frontend
    # 对外唯一暴露端口：宿主机 8081 -> 容器 nginx 80
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build: .
    container_name: novel_agent_backend
    command: sh -c "python -m app.init_db && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4-turbo-preview}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-key}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # 同源 /api 反代方案下浏览器请求不跨域，CORS 白名单可留空或按需注入
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8081}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/novel_agent
      - CHROMA_PERSIST_DIRECTORY=/data/chroma
    volumes:
      - chroma_data:/data/chroma
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: novel_agent_db
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=novel_agent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d novel_agent"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
  chroma_data: